<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./public/graphpaintericon.ico" />
  <link rel="preload" href="https://media.cdnandroid.com/item_images/1097581/imagen-github-0thumb.jpeg" as="image">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="graphpainter" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

      /* Thin scrollbar */
      ::-webkit-scrollbar {
        width: 2px;
        height: 2px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--muted-foreground);
        border-radius: 2px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--foreground);
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: var(--muted-foreground) transparent;
      }

    }
  </style>
  <title>Graph Painter</title>
</head>

<body>
  <div id="root"></div>
</body>

</html>
